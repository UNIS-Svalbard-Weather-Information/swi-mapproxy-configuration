<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Run Out Area Legend</title>
</head>

<body>
  <div style="display: flex; flex-direction: column; gap: 0.75rem">
    <div style="display: flex; align-items: flex-start; gap: 0.75rem">
      <div
        style="background-color: #284da6; width: 1.25rem; height: 1.25rem; flex-shrink: 0; border: 1px solid #3d3d3d; border-radius: 2px;">
      </div>
      <span style="font-size: 0.875rem">Short runouts (50% of the avalanches reach farther)</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 0.75rem">
      <div
        style="background-color: #6a9bfc; width: 1.25rem; height: 1.25rem; flex-shrink: 0; border: 1px solid #3d3d3d; border-radius: 2px;">
      </div>
      <span style="font-size: 0.875rem">Medium runouts (25% of the avalanches reach farther)</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 0.75rem">
      <div
        style="background-color: #a1b1e4; width: 1.25rem; height: 1.25rem; flex-shrink: 0; border: 1px solid #3d3d3d; border-radius: 2px;">
      </div>
      <span style="font-size: 0.875rem">Long runouts (5% of the avalanches reach farther) - Some avalanches
        may have longer runouts than displayed as runout zones in the
        map.</span>
    </div>
    <div style="
          display: flex;
          align-items: center;
          gap: 0.5rem;
          margin-top: 1rem;
        ">
      <a href="https://regobs.no/?hazard=10&daysBack=2&orderBy=changeTime&regions=3003" target="_blank"
        rel="noopener noreferrer" style="font-size: 0.75rem; color: #3b82f6; text-decoration: none">
        View on Varsom RegObs &rarr;
      </a>
    </div>
  </div>
</body>

</html>
