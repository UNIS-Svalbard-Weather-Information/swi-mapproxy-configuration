# --------------------------------------------------------------
# MapProxy configuration for Svalbard Weather Information (SWI)
# --------------------------------------------------------------
#
#
# This configuration sets up MapProxy to serve and cache the following layers:
# - Latest Sea Ice Chart from MET Norway (redis cached, 2 min TTL)
# - Avalanche Forecast for today and tomorow (redis cached, 2min TTL)
# - Slope Steepness from NVE (file cached)
# - Runout Area from NVE (file cached)


services:
  demo:
  wmts:
  wms:
    srs: ["EPSG:3857"]
    image_formats: ["image/png", "image/jpeg"]
    on_source_errors: notify


layers:
  - name: met_icechart
    title: Latest Ice Chart
    sources: [icechart_cache]
    wmts_rest_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    wmts_kvp_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    md:
        abstract: Latest sea ice chart provided by MET Norway.

  - name: avalanche-forecast-0
    title: Today Avalanche Forecast
    sources: [avalanche-forecast-0_cache]
    wmts_rest_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    wmts_kvp_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    md:
        abstract: Avalanche Forecast for Nordenskiöld Land for the currect day updated at 00:01 and 15:01 UTC from the Varsom API.

  - name: avalanche-forecast-1
    title: Today Avalanche Forecast
    sources: [avalanche-forecast-1_cache]
    wmts_rest_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    wmts_kvp_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    md:
        abstract: Avalanche Forecast for Nordenskiöld Land for the next day updated at 00:01 and 15:01 UTC from the Varsom API.

  - name: nve_slope_steepness
    title: Slope Steepness
    sources: [slope_steepness_cache]
    wmts_rest_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    md:
      abstract: Slope steepness data provided by NVE as displayed on Varsom RegObs.

  - name: nve_runout_area
    title: Runout Area
    sources: [nve_runout_area_cache]
    wmts_rest_legendurl: "{base_url}/metadata/{layer_name}/legend.html"
    md:
      abstract: Runout area data provided by NVE as displayed on Varsom RegObs.

  - name: nma_nautical_chart
    title: Runout Area
    sources: [nma_nautical_chart_cache]
    md:
      abstract: Norwegian Mapping Authotity Nautical Chart - NOT FOR NAVIGATION.

caches:
  icechart_cache:
    grids: [webmercator]
    sources: [icechart]
    cache:
      type: redis
      default_ttl: 120
      host: $MAPPROXY_REDIS_HOST
      port: $MAPPROXY_REDIS_PORT
      username: $MAPPROXY_REDIS_USERNAME
      password: $MAPPROXY_REDIS_PASSWORD

  avalanche-forecast-0_cache:
    grids: [webmercator]
    sources: [avalanche-forecast-0]
    cache:
      type: redis
      default_ttl: 120
      host: $MAPPROXY_REDIS_HOST
      port: $MAPPROXY_REDIS_PORT
      username: $MAPPROXY_REDIS_USERNAME
      password: $MAPPROXY_REDIS_PASSWORD

  avalanche-forecast-1_cache:
    grids: [webmercator]
    sources: [avalanche-forecast-1]
    cache:
      type: redis
      default_ttl: 120
      host: $MAPPROXY_REDIS_HOST
      port: $MAPPROXY_REDIS_PORT
      username: $MAPPROXY_REDIS_USERNAME
      password: $MAPPROXY_REDIS_PASSWORD

  slope_steepness_cache:
    grids: [webmercator]
    sources: [nve_slope_steepness]
    cache:
      type: mbtiles
      filename: /mapproxy/mbtiles/slope_steepness_cache.mbtiles

  nve_runout_area_cache:
    grids: [webmercator]
    sources: [nve_runout_short]
    cache:
      type: mbtiles
      filename: /mapproxy/mbtiles/nve_runout_area_cache.mbtiles

  nma_nautical_chart_cache:
    grids: [webmercator]
    sources: [nma_nautical_chart]
    cache:
      type: mbtiles
      filename: /mapproxy/mbtiles/nma_nautical_chart_cache.mbtiles

sources:
  icechart:
    type: mapnik
    mapfile: /mapproxy/data/latest_seaice/latest.xml
    layers: latest_ice_chart
    transparent: true
    multithreaded: true

  avalanche-forecast-0:
    type: mapnik
    mapfile: /mapproxy/data/avalanche-forecast-0/0.xml
    layers: avalanche_layer
    transparent: true
    multithreaded: true

  avalanche-forecast-1:
    type: mapnik
    mapfile: /mapproxy/data/avalanche-forecast-1/1.xml
    layers: avalanche_layer
    transparent: true
    multithreaded: true

  nve_slope_steepness:
    type: wms
    req:
      url: https://gis3.nve.no/arcgis/services/wmts/Bratthet_med_utlop_2024/MapServer/WMSServer?
      layers: 4
      versions: 1.3.0
      transparent: true
      format: image/png
    on_error:
      500:
        response: transparent
        cache: False

  nve_runout_short:
    type: wms
    req:
      url: https://gis3.nve.no/arcgis/services/wmts/Bratthet_med_utlop_2024/MapServer/WMSServer?
      layers: 1,2,3
      versions: 1.3.0
      transparent: true
      format: image/png
    on_error:
      500:
        response: transparent
        cache: False

  nma_nautical_chart:
    type: wms
    req:
      url: https://wms.geonorge.no/skwms1/wms.sjokartraster2?
      layers: all
      versions: 1.3.0
      transparent: true
      format: image/png
      supported_srs: ['EPSG:25833']
    on_error:
      500:
        response: transparent
        cache: False

grids:
    webmercator:
        base: GLOBAL_WEBMERCATOR   